name: Deploy Origami to DigitalOcean

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: origami-production
  cancel-in-progress: false

jobs:
  build:
    name: Verify frontend build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact commit
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: client/package-lock.json
      - name: Install frontend dependencies
        working-directory: client
        run: npm ci
      - name: Build frontend
        working-directory: client
        run: npm run build

  deploy:
    name: Deploy to droplet
    needs: build
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Deploy over OpenSSH
        shell: bash
        env:
          DO_HOST: ${{ secrets.DO_HOST }}
          DO_USER: ${{ secrets.DO_USER }}
          DO_SSH_KEY: ${{ secrets.DO_SSH_KEY }}
          DO_HOST_FINGERPRINT: ${{ secrets.DO_HOST_FINGERPRINT }}
        run: |
          set -euo pipefail

          umask 077
          mkdir -p "$HOME/.ssh"

          printf '%s\n' "$DO_SSH_KEY" > "$HOME/.ssh/origami_deploy"
          chmod 600 "$HOME/.ssh/origami_deploy"

          trap 'rm -f "$HOME/.ssh/origami_deploy"' EXIT

          ssh-keyscan -T 15 -t ed25519 "$DO_HOST" \
            2>/dev/null > "$HOME/.ssh/known_hosts"

          test -s "$HOME/.ssh/known_hosts"

          ACTUAL_FINGERPRINT=$(
            ssh-keygen -lf "$HOME/.ssh/known_hosts" -E sha256 |
            awk '$NF == "(ED25519)" { print $2; exit }'
          )

          if [[ "$ACTUAL_FINGERPRINT" != "$DO_HOST_FINGERPRINT" ]]; then
            echo "::error::SSH host fingerprint mismatch"
            exit 1
          fi

          echo "SSH host identity verified"

          ssh -T \
            -i "$HOME/.ssh/origami_deploy" \
            -o IdentitiesOnly=yes \
            -o HostKeyAlgorithms=ssh-ed25519 \
            -o StrictHostKeyChecking=yes \
            -o UserKnownHostsFile="$HOME/.ssh/known_hosts" \
            -o ConnectTimeout=15 \
            "$DO_USER@$DO_HOST" 'bash -se' <<'REMOTE'
              set -euo pipefail

              cd /home/app/app
              git fetch origin main
              git checkout main
              git pull --ff-only origin main

              cd /home/app/app/server
              npm ci

              cd /home/app/app/client
              npm ci
              npm run build

              cd /home/app/app/server
              pm2 restart origami-app --update-env
              pm2 status origami-app
              pm2 logs origami-app --lines 30 --nostream
          REMOTE
      - name: Verify server host key
        shell: bash
        env:
          DO_HOST: ${{ secrets.DO_HOST }}
          EXPECTED_FINGERPRINT: ${{ secrets.DO_HOST_FINGERPRINT }}
        run: |
          set -euo pipefail

          ssh-keyscan -T 10 -t ed25519,ecdsa,rsa "$DO_HOST" \
            2>/dev/null > /tmp/origami-hostkeys

          test -s /tmp/origami-hostkeys

          ssh-keygen -lf /tmp/origami-hostkeys -E sha256

          if ssh-keygen -lf /tmp/origami-hostkeys -E sha256 |
            awk -v expected="$EXPECTED_FINGERPRINT" \
            '$2 == expected { found=1 } END { exit !found }'; then
            echo "Host fingerprint matches a server key"
          else
            echo "::error::Fingerprint does not match any advertised host key"
            exit 1
          fi
      - name: Validate SSH fingerprint configuration
        env:
          HOST_FINGERPRINT: ${{ secrets.DO_HOST_FINGERPRINT }}
        shell: bash
        run: |
          if [[ -z "$HOST_FINGERPRINT" ]]; then
            echo "::error::DO_HOST_FINGERPRINT is missing"
            exit 1
          fi
          if [[ ! "$HOST_FINGERPRINT" =~ ^SHA256:[A-Za-z0-9+/]{43}$ ]]; then
            echo "::error::Invalid fingerprint format"
            exit 1
          fi
          echo "Fingerprint secret is present and correctly formatted"

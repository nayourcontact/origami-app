name: Deploy Origami to DigitalOcean

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: origami-production
  cancel-in-progress: false

jobs:
  build:
    name: Verify frontend build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact commit
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: client/package-lock.json
      - name: Install frontend dependencies
        working-directory: client
        run: npm ci
      - name: Build frontend
        working-directory: client
        run: npm run build

  deploy:
    name: Deploy to droplet
    needs: build
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Verify server host key
        shell: bash
        env:
          DO_HOST: ${{ secrets.DO_HOST }}
          EXPECTED_FINGERPRINT: ${{ secrets.DO_HOST_FINGERPRINT }}
        run: |
          set -euo pipefail

          ssh-keyscan -T 10 -t ed25519,ecdsa,rsa "$DO_HOST" \
            2>/dev/null > /tmp/origami-hostkeys

          test -s /tmp/origami-hostkeys

          ssh-keygen -lf /tmp/origami-hostkeys -E sha256

          if ssh-keygen -lf /tmp/origami-hostkeys -E sha256 |
            awk -v expected="$EXPECTED_FINGERPRINT" \
            '$2 == expected { found=1 } END { exit !found }'; then
            echo "Host fingerprint matches a server key"
          else
            echo "::error::Fingerprint does not match any advertised host key"
            exit 1
          fi
      - name: Validate SSH fingerprint configuration
        env:
          HOST_FINGERPRINT: ${{ secrets.DO_HOST_FINGERPRINT }}
        shell: bash
        run: |
          if [[ -z "$HOST_FINGERPRINT" ]]; then
            echo "::error::DO_HOST_FINGERPRINT is missing"
            exit 1
          fi
          if [[ ! "$HOST_FINGERPRINT" =~ ^SHA256:[A-Za-z0-9+/]{43}$ ]]; then
            echo "::error::Invalid fingerprint format"
            exit 1
          fi
          echo "Fingerprint secret is present and correctly formatted"

      - name: Deploy over SSH
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.DO_HOST }}
          username: ${{ secrets.DO_USER }}
          key: ${{ secrets.DO_SSH_KEY }}
          fingerprint: ${{ secrets.DO_HOST_FINGERPRINT }}
          port: 22
          envs: DEPLOY_SHA
          command_timeout: 15m
          script: |
            set -eu
            cd /home/app/app
            test -z "$(git status --porcelain --untracked-files=no)" || { echo 'ERROR: Uncommitted tracked changes on droplet'; exit 1; }
            git fetch origin main
            git checkout main
            test "$(git rev-parse origin/main)" = "$DEPLOY_SHA" || { echo 'ERROR: main advanced since workflow began; refusing stale deploy'; exit 1; }
            git merge --ff-only origin/main
            cd /home/app/app/server
            npm ci --omit=dev
            cd /home/app/app/client
            npm ci
            npm run build
            cd /home/app/app/server
            pm2 restart origami-app --update-env
            pm2 status origami-app
            echo "Deployed commit: $DEPLOY_SHA"

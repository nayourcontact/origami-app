name: Deploy Origami to DigitalOcean

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: origami-production
  cancel-in-progress: false

jobs:
  build:
    name: Verify frontend build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact commit
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: client/package-lock.json
      - name: Install frontend dependencies
        working-directory: client
        run: npm ci
      - name: Build frontend
        working-directory: client
        run: npm run build

  deploy:
    name: Deploy to droplet
    needs: build
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Deploy over SSH
        uses: appleboy/ssh-action@0ff4204d59e8e51228ff73bce53f80d53301dee2 # v1.2.5
        env:
          DEPLOY_SHA: ${{ github.sha }}
        with:
          host: ${{ secrets.DO_HOST }}
          username: ${{ secrets.DO_USER }}
          key: ${{ secrets.DO_SSH_KEY }}
          fingerprint: ${{ secrets.DO_HOST_FINGERPRINT }}
          port: 22
          envs: DEPLOY_SHA
          command_timeout: 15m
          script: |
            set -eu
            cd /home/app/app
            test -z "$(git status --porcelain --untracked-files=no)" || { echo 'ERROR: Uncommitted tracked changes on droplet'; exit 1; }
            git fetch origin main
            git checkout main
            test "$(git rev-parse origin/main)" = "$DEPLOY_SHA" || { echo 'ERROR: main advanced since workflow began; refusing stale deploy'; exit 1; }
            git merge --ff-only origin/main
            cd /home/app/app/server
            npm ci --omit=dev
            cd /home/app/app/client
            npm ci
            npm run build
            cd /home/app/app/server
            pm2 restart origami-app --update-env
            pm2 status origami-app
            echo "Deployed commit: $DEPLOY_SHA"
